name: Update supermarket prices

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Refresh Consumer Council data
        run: python scripts/refresh-data.py
      - name: Build the standalone page
        run: node scripts/generate-portable.mjs
      - name: Commit an updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site-data data/pricewatch-cache.json
          git diff --cached --quiet || git commit -m "Update supermarket prices"
          git push
